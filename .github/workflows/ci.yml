name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore backend/AeroUrl.slnx

      - name: Build
        run: dotnet build backend/AeroUrl.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/AeroUrl.slnx --no-build --configuration Release